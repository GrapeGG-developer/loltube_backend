# Koyeb config - optional, можно деплоить без него через UI
# Этот файл для справки
name: loltube-grapescript
regions:
  - fra
instance_type: free
scaling:
  min: 1
  max: 1
ports:
  - port: 3000
    protocol: http
routes:
  - path: /
    port: 3000
env:
  NODE_ENV: production
  PORT: 3000
  JWT_SECRET: loltube-secret-violet-2024-v2-grapescript
health_checks:
  - port: 3000
    path: /api/config
build:
  dockerfile: Dockerfile
