<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ЛОЛ ТУБ v2</title>
  <meta name="theme-color" content="#7c3aed">
  <link rel="stylesheet" href="./style.css?v=6.4">
  <script src="./config.js?v=6.4"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='monospace' font-weight='700' font-size='18'>ЛОЛ</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="gradient-bg"></div>
  <div id="hyperIsland" class="hyper-island"><span class="island-dot"></span><span id="islandText">ЛОЛ ТУБ v2</span></div>

  <header class="topbar">
    <div class="topbar-left" onclick="app.navigate('home')">
      <div class="logo">
        <span class="logo-lol">ЛОЛ</span><span class="logo-tube">ТУБ</span>
        <span class="version-badge">v2</span>
      </div>
    </div>
    <div class="topbar-center">
      <div id="connectionIcon" class="connection-icon checking" title="Проверка соединения">
        <span class="conn-dot"></span>
      </div>
    </div>
    <div class="topbar-right">
      <button class="top-upload-btn" onclick="app.navigate('upload')" title="Загрузить">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="accountBtn" class="account-btn" onclick="app.openProfile()">ВОЙТИ</button>
    </div>
  </header>

  <div class="search-bar">
    <div class="search-input-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="ПОИСК ВИДЕО, АВТОРОВ..." maxlength="50" onkeydown="if(event.key==='Enter') app.doSearch()">
    </div>
    <button onclick="app.doSearch()" class="search-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    </button>
  </div>

  <main id="app" class="app"></main>

  <nav class="bottom-nav">
    <button id="navHome" class="active" onclick="app.navigate('home')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>ГЛАВНАЯ</span>
    </button>
    <button id="navLive" onclick="app.navigate('live')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"/><polyline points="17 2 12 7 7 2"/></svg>
      <span>ТВ</span>
    </button>
    <button id="navFriends" onclick="app.navigate('friends')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>ДРУЗЬЯ</span>
    </button>
    <button id="navProfile" onclick="app.openProfile()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>ПРОФИЛЬ</span>
    </button>
  </nav>

  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <div class="login-logo">
        <span class="logo-lol">ЛОЛ</span><span class="logo-tube">ТУБ</span>
        <span class="version-badge">v2</span>
      </div>
      <div class="field">
        <label>НИК</label>
        <input id="loginNick" type="text" placeholder="" maxlength="20" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label>ПИН-КОД • 3 ЦИФРЫ</label>
        <input id="loginPin" type="text" placeholder="" maxlength="3" inputmode="numeric" autocomplete="off" spellcheck="false">
      </div>
      <div id="loginError" class="error" style="display:none"></div>
      <button id="loginSubmit" class="btn btn-primary btn-block" onclick="app.doLogin()">ВОЙТИ</button>
      <button id="testPixel" class="test-pixel" title=""></button>
      <div id="backendStatus" class="backend-status-icon">
        <span id="backendDot" class="status-dot checking"></span>
      </div>
    </div>
  </div>

  <input id="avatarInput" type="file" accept="image/*" style="display:none">
  <input id="bannerInput" type="file" accept="image/*" style="display:none">
  <script src="./app.js?v=6.4"></script>
</body>
</html>
