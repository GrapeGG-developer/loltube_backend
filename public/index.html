<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ЛОЛ ТУБ v1</title>
  <meta name="theme-color" content="#7c3aed">
  <!-- ОТНОСИТЕЛЬНЫЕ ПУТИ для GitVerse Pages /loltube/ -->
  <link rel="stylesheet" href="./style.css?v=5.0">
  <script src="./config.js?v=5.0"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='white' font-family='monospace' font-weight='700' font-size='18'>ЛОЛ</text></svg>">
</head>
<body>
  <div class="gradient-bg"></div>

  <header class="topbar">
    <div class="topbar-left" onclick="app.navigate('home')">
      <div class="logo">
        <span class="logo-lol">ЛОЛ</span><span class="logo-tube">ТУБ</span>
        <span class="version-badge">v1</span>
      </div>
      <a class="dev-link" href="https://grapegg-developer.github.io/RoboBattle-Web/" target="_blank" rel="noopener" onclick="event.stopPropagation()">https://grapegg-developer.github.io/RoboBattle-Web/</a>
    </div>
    <div class="topbar-right">
      <button id="uploadBtnTop" class="top-upload-btn" onclick="app.navigate('upload')">+ ЗАГРУЗИТЬ</button>
      <button id="accountBtn" class="account-btn" onclick="app.openProfile()">ВОЙТИ</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <div class="login-logo">
        <span class="logo-lol">ЛОЛ</span><span class="logo-tube">ТУБ</span>
        <span class="version-badge">v1</span>
      </div>
      <div class="field">
        <label>НИК</label>
        <input id="loginNick" type="text" placeholder="" maxlength="20" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label>ПИН-КОД • 3 ЦИФРЫ</label>
        <input id="loginPin" type="text" placeholder="" maxlength="3" inputmode="numeric" autocomplete="off" spellcheck="false">
      </div>
      <div id="loginError" class="error" style="display:none"></div>
      <button id="loginSubmit" class="btn btn-primary btn-block" onclick="app.doLogin()">ВОЙТИ</button>
      <button id="testPixel" class="test-pixel" title=""></button>
      <div id="backendStatus" class="backend-status">
        <span id="backendDot" class="status-dot checking"></span>
        <span id="backendStatusText">ПРОВЕРКА БЕКЕНДА...</span>
      </div>
    </div>
  </div>

  <input id="avatarInput" type="file" accept="image/*" style="display:none">
  <script src="./app.js?v=5.0"></script>
</body>
</html>
